<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Product Details - Aerox Voult</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f5f5f5;
    color:#111;
}

header{
    background:#111;
    color:white;
    padding:8px 3%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo {
    width: 110px;
    height: 45px;
    display: flex;
    align-items: center;
    overflow: hidden;
}

.logo img {
    width: 100% !important;
    height: 100% !important;
    max-width: 110px !important;
    max-height: 45px !important;
    object-fit: contain !important;
    display: block !important;
}

.back{
    color:white;
    text-decoration:none;
    background:#333;
    padding:9px 15px;
    border-radius:7px;
}

.product-page{
    max-width:1100px;
    margin:35px auto;
    padding:0 20px;
}

.product-container{
    background:white;
    border-radius:15px;
    padding:25px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:35px;
}

.main-image{
    width:100%;
    height:450px;
    object-fit:cover;
    border-radius:12px;
}

.thumbnails{
    display:flex;
    gap:10px;
    margin-top:12px;
    overflow-x:auto;
}

.thumbnails img{
    width:80px;
    height:80px;
    object-fit:cover;
    border-radius:8px;
    cursor:pointer;
    border:2px solid transparent;
}

.thumbnails img:hover{
    border-color:#111;
}

.category{
    color:#777;
    font-size:14px;
    margin-bottom:8px;
}

.product-title{
    font-size:32px;
    margin-bottom:12px;
}

.price{
    font-size:26px;
    font-weight:bold;
    margin:15px 0;
}

.description{
    line-height:1.7;
    color:#555;
}

.details{
    margin-top:25px;
    padding-top:20px;
    border-top:1px solid #ddd;
}

.details h3{
    margin-bottom:10px;
}

.add-cart{
    width:100%;
    padding:14px;
    margin-top:25px;
    background:#111;
    color:white;
    border:0;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}


.checkout-box{margin-top:18px;border-top:2px dashed #ddd;padding-top:16px;}
.checkout-box h3{margin-bottom:12px;font-size:18px;}
.checkout-box label.fl{display:block;font-size:14px;font-weight:bold;margin:10px 0 5px;}
.checkout-box input[type=text],.checkout-box input[type=tel],.checkout-box textarea{
    width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;font-size:15px;outline:none;}
.checkout-box input:focus,.checkout-box textarea:focus{border-color:#111;}
.checkout-box textarea{min-height:75px;resize:vertical;}
.area-opt{display:flex;align-items:center;gap:10px;border:1px solid #ccc;border-radius:8px;
    padding:12px;margin-top:8px;cursor:pointer;font-size:15px;}
.area-opt input{width:18px;height:18px;accent-color:#111;}
.area-opt span{flex:1;}
.area-opt b{white-space:nowrap;}
.area-opt.active{border-color:#111;background:#f3f3f3;}
.cod-note{margin-top:10px;font-size:13px;color:#555;background:#fff7e6;border:1px solid #ffd591;
    padding:9px 11px;border-radius:8px;}
.sum-row{display:flex;justify-content:space-between;margin-top:8px;font-size:15px;}
.sum-row.grand{font-size:20px;font-weight:bold;border-top:1px solid #ddd;padding-top:10px;margin-top:12px;}
.place-order{width:100%;margin-top:16px;padding:14px;border:0;border-radius:8px;
    background:#111;color:#fff;font-size:16px;font-weight:bold;cursor:pointer;}
.place-order:disabled{opacity:.6;cursor:default;}
.form-error{color:#d00;font-size:13px;margin-top:8px;display:none;}
.success-box{text-align:center;padding:10px 0;}
.success-box .tick{font-size:54px;}
.success-box p{margin-top:10px;line-height:1.6;color:#444;}

.order-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:2000;
    align-items:center;justify-content:center;padding:16px;}
.order-modal-box{background:#fff;width:100%;max-width:500px;max-height:92vh;overflow:auto;
    border-radius:14px;padding:20px;position:relative;}
.order-close{position:absolute;right:14px;top:8px;font-size:28px;cursor:pointer;}
.order-product{display:flex;gap:12px;align-items:center;margin-top:10px;}
.order-product img{width:70px;height:70px;object-fit:cover;border-radius:8px;}
.order-qty{display:flex;gap:10px;align-items:center;margin-top:8px;}
.order-qty button{width:30px;height:30px;border:0;background:#111;color:#fff;border-radius:6px;cursor:pointer;font-size:16px;}
.buy-now{width:100%;padding:14px;margin-top:10px;background:#25a244;color:#fff;border:0;
    border-radius:8px;cursor:pointer;font-size:16px;}


@media(max-width:700px){

    .product-container{
        grid-template-columns:1fr;
        padding:15px;
    }

    .main-image{
        height:350px;
    }

    .product-title{
        font-size:25px;
    }

}

</style>
</head>

<body>


<header>

    <div class="logo">

    <a
        href="index.html"

        Back

<div class="product-page">

    <div class="product-container">

        <div>

</div>



<div class="order-modal" id="orderModal">

        <div class="order-product">

            </div>
        </div>

        <div class="checkout-box">

        <label class="fl" for="custName">নাম / Name</label>
        <input type="text" id="custName" placeholder="আপনার নাম" autocomplete="name">

        <label class="fl" for="custPhone">মোবাইল নম্বর / Phone</label>
        <input type="tel" id="custPhone" placeholder="01XXXXXXXXX" inputmode="numeric" autocomplete="tel">

        <label class="fl" for="custAddress">ঠিকানা / Address</label>
        <textarea id="custAddress" placeholder="বাসা/রোড, এলাকা, থানা, জেলা" autocomplete="street-address"></textarea>

        <label class="fl">ডেলিভারি এরিয়া / Delivery Area (Cash on Delivery)</label>
        <label class="area-opt active" id="optDhaka">
            <input type="radio" name="area" value="dhaka" checked onchange="updateSummary()">
            <span>ঢাকার ভেতরে</span><b>৳80</b>
        </label>
        <label class="area-opt" id="optOutside">
            <input type="radio" name="area" value="outside" onchange="updateSummary()">
            <span>ঢাকার বাইরে</span><b>৳120</b>
        </label>
        <div class="cod-note">💵 Cash on Delivery: পণ্য হাতে পেয়ে টাকা দেবেন।</div>

            <div class="sum-row"><span>Product Total</span><span>৳<span id="subTotal">0</span></span></div>
            <div class="sum-row"><span>Delivery Charge</span><span>৳<span id="deliveryFee">80</span></span></div>
            <div class="sum-row grand"><span>Grand Total</span><span>৳<span id="grandTotal">0</span></span></div>
            <div class="form-error" id="formError"></div>
            <button class="place-order" id="placeBtn" onclick="placeOrder()">✅ Place Order (Cash on Delivery)</button>
        </div>
    </div>
</div>

<script>


/* =================================================
   ORDER SETTINGS
   ORDER_ENDPOINT: অর্ডার নিজের কাছে পাঠাতে চাইলে এখানে
   Formspree / Google Apps Script ইত্যাদির URL বসাবে।
================================================= */

const ORDER_ENDPOINT = "https://script.google.com/macros/s/AKfycbxPjSbqt848wWQWMkmBK3ZbL6BIljZ5XSkAEi3Q_hIfwWDpxM1KDDudOWQehs53PCGvGw/exec";
const DELIVERY_CHARGE = { dhaka:80, outside:120 };

function getArea(){
    const r = document.querySelector('input[name="area"]:checked');
    return r ? r.value : "dhaka";
}

function esc(t){
    const d = document.createElement("div");
    d.textContent = t;
    return d.innerHTML;
}

function validateCustomer(prefix){
    const name = document.getElementById(prefix+"custName").value.trim();
    const phone = document.getElementById(prefix+"custPhone").value.trim().replace(/[\s-]/g,"");
    const address = document.getElementById(prefix+"custAddress").value.trim();
    const err = document.getElementById(prefix+"formError");
    let msg = "";
    if(name.length < 2) msg = "আপনার নাম লিখুন।";
    else if(!/^(\+?88)?01[3-9]\d{8}$/.test(phone)) msg = "সঠিক মোবাইল নম্বর দিন (যেমন 01XXXXXXXXX)।";
    else if(address.length < 8) msg = "পূর্ণ ঠিকানা লিখুন।";
    err.innerText = msg;
    err.style.display = msg ? "block" : "none";
    return msg ? null : { name, phone, address };
}

async function submitOrder(order){
    const list = JSON.parse(localStorage.getItem("AeroxOrders") || "[]");
    list.push(order);
    localStorage.setItem("AeroxOrders", JSON.stringify(list));
    if(!ORDER_ENDPOINT) return;
    const res = await fetch(ORDER_ENDPOINT,{
        method:"POST",
        headers:{ "Content-Type":"text/plain;charset=utf-8" },
        body:JSON.stringify(order)
    });
    const data = await res.json();
    if(!data.ok) throw new Error(data.error || "failed");
}

function successHTML(order){
    return `
    <div class="success-box">
        <div class="tick">✅</div>
        <h2>অর্ডার সম্পন্ন হয়েছে!</h2>
        <p>অর্ডার নম্বর: <b>${order.id}</b><br>
        মোট: <b>৳${order.grandTotal}</b> (Cash on Delivery)<br>
        আমরা শীঘ্রই ${esc(order.phone)} নম্বরে যোগাযোগ করব।</p>
        <button class="place-order" onclick="location.reload()">ঠিক আছে</button>
    </div>`;
}

/* =================================================
   GET PRODUCT
================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );

const id =
    Number(
        params.get("id")
    );

const product =
    products.find(
        item => item.id === id
    );


/* =================================================
   SHOW PRODUCT
================================================= */

if(product){

    document.getElementById(
        "mainImage"
    ).src = product.images[0];


    document.getElementById(
        "productName"
    ).innerText = product.name;


    document.getElementById(
        "category"
    ).innerText = product.category;


    document.getElementById(
        "price"
    ).innerText = "৳" + product.price;


    document.getElementById(
        "description"
    ).innerText = product.description;


    document.getElementById(
        "details"
    ).innerHTML =
    product.details.map(
        detail => "<li>" + detail + "</li>"
    ).join("");


    const thumbnails =
        document.getElementById(
            "thumbnails"
        );


    product.images.forEach(image => {

        const img =
            document.createElement("img");

        img.src = image;


        img.onclick = function(){

            ).src = image;

        };

/* =================================================
   ADD TO CART
================================================= */

function addToCart(){

    let cart =
        JSON.parse(
            localStorage.getItem(
                "AeroxCart"
            )
        ) || [];


    const existing =
        cart.find(
            item => item.id === product.id
        );


    if(existing){

        existing.quantity++;

    }else{

        cart.push({

            id:product.id,

            name:product.name,

            price:product.price,

            image:product.images[0],

            quantity:1

        });

    }


    localStorage.setItem(
        "AeroxCart",
        JSON.stringify(cart)
    );

const msg = document.createElement("div");

msg.innerText = "Add to cart successfully ✅";

msg.style.cssText = `
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    background:white;
    color:#111;
    padding:25px 30px;
    border-radius:30px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
    z-index:99999;
    font-size:19px;
    white-space: nowrap;
`;

document.body.appendChild(msg);

setTimeout(() => {
    msg.remove();
}, 400);

}


/* =================================================
   ORDER THIS PRODUCT (CASH ON DELIVERY)
================================================= */

let orderQty = 1;

function openOrder(){
    if(!product) return;
    orderQty = 1;
    document.getElementById("oImg").src = product.images[0];
    document.getElementById("oName").innerText = product.name;
    document.getElementById("orderModal").style.display = "flex";
    updateSummary();
}

function closeOrder(){
    document.getElementById("orderModal").style.display = "none";
}

function changeOrderQty(n){
    orderQty = Math.max(1, orderQty + n);
    updateSummary();
}

function updateSummary(){
    if(!product) return;
    const sub = product.price * orderQty;
    const fee = DELIVERY_CHARGE[getArea()];
    document.getElementById("oQty").innerText = orderQty;
    document.getElementById("oLine").innerHTML =
        "৳" + product.price + " × " + orderQty + " = <b>৳" + sub + "</b>";
    document.getElementById("subTotal").innerText = sub;
    document.getElementById("deliveryFee").innerText = fee;
    document.getElementById("grandTotal").innerText = sub + fee;
    document.getElementById("optDhaka").classList.toggle("active", getArea()==="dhaka");
    document.getElementById("optOutside").classList.toggle("active", getArea()==="outside");
}

async function placeOrder(){

    const c = validateCustomer("");
    if(!c) return;

    const sub = product.price * orderQty;
    const fee = DELIVERY_CHARGE[getArea()];

    const order = {
        id: "AV" + Date.now().toString().slice(-8),
        date: new Date().toISOString(),
        name: c.name,
        phone: c.phone,
        address: c.address,
        area: getArea() === "dhaka" ? "Inside Dhaka" : "Outside Dhaka",
        payment: "Cash on Delivery",
        items: [{
            name: product.name, quantity: orderQty,
            price: product.price, total: sub
        }],
        subTotal: sub,
        deliveryCharge: fee,
        grandTotal: sub + fee
    };

    const btn = document.getElementById("placeBtn");
    btn.disabled = true;
    btn.innerText = "Please wait...";

    try{
        await submitOrder(order);
    }catch(e){
        btn.disabled = false;
        btn.innerText = "✅ Place Order (Cash on Delivery)";
        const err = document.getElementById("formError");
        err.innerText = e.message === "wait"
            ? "এই নম্বর থেকে এইমাত্র অর্ডার গেছে। ৩০ সেকেন্ড পর আবার চেষ্টা করুন।"
            : "অর্ডার পাঠানো যায়নি। ইন্টারনেট চেক করে আবার চেষ্টা করুন।";
        err.style.display = "block";
        return;
    }

    document.getElementById("orderBox").innerHTML = successHTML(order);

}
